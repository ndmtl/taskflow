<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de formulaire</title>

    <link rel="stylesheet" href="assets/css/style.css">



</head>

<body>
    <!--Création du form avec novalidate qui empêche la validation des champs en html5-->
    <main>
        <section>
            <div class="container">

                <form id="form" action="confirmation.html" method="get" novalidate>
                    <h1>Création de compte</h1>
                    <hr />
                    <p>Merci. Votre compte est actif, vous pouvez désormais vous connecter.
                    </p>
                </form>
            </div>
        </section>
    </main>

</body>

</html>
